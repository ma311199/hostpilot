[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hostpilot"
version = "0.1.0"
description = "Governed personal-client agent runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "structlog>=24.1,<26",
    "pyyaml>=6,<7",
    "fastapi>=0.115,<1",
    "aiosqlite>=0.21,<1",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "types-PyYAML>=6,<7",
    "ruff>=0.11,<1",
    "httpx>=0.27,<1",
]
agents = [
    "deepagents>=0.2,<1",
    "fastmcp>=2,<3",
    "httpx>=0.27,<1",
    "langchain>=1,<2",
    "langchain-mcp-adapters>=0.1,<1",
    "langchain-openai>=0.3,<2",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3.1.2,<4",
]
prototype = [
    "gradio>=5,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
python-downloads = "automatic"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
warn_unreachable = true
