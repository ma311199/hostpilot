dataset_id: imported-skills-smoke
version: 1
description: >-
  Low-impact runtime smoke cases for the three user Skills added on 2026-11-12.
  Prompts ask for text-only results and explicitly prohibit network access,
  file creation, and external communication.
cases:
  - case_id: multi-search-001
    category: business_skill_routing
    prompt: >-
      用多引擎搜索帮我准备调研“Linux bubblewrap 沙箱隔离”：只列出适合的两个搜索引擎和组合查询词，不要实际访问网络、打开网页或运行脚本。
    expected:
      route: skill_execute
      skill_id: legacy/multi-search-engine
      tool_calls: []
  - case_id: multi-search-002
    category: business_skill_routing
    prompt: >-
      我想从多个公开来源核实 RRF 融合排名的含义。请给出两条中英文检索式和适合的搜索引擎，不发送网络请求、不打开网页、不执行脚本。
    expected:
      route: skill_execute
      skill_id: legacy/multi-search-engine
      tool_calls: []
  - case_id: office-automation-001
    category: business_skill_routing
    prompt: >-
      把下面内容整理成简短的文字周报，列出完成事项、待办和负责人；只返回文本，不读取或创建文件、不发邮件：本周完成接口联调；登录超时仍待修复；陈晨负责修复，目标周五。
    expected:
      route: skill_execute
      skill_id: legacy/office-automation
      tool_calls: []
  - case_id: office-automation-002
    category: business_skill_routing
    prompt: >-
      请整理这组虚构销售数据，计算总额并用文字列出各地区金额：华东 120，华南 80，华北 100。只在回复中呈现结果，不生成文件或访问外部服务。
    expected:
      route: skill_execute
      skill_id: legacy/office-automation
      tool_calls: []
  - case_id: ppt-generator-001
    category: business_skill_routing
    prompt: >-
      为“HostPilot Linux Agent 开发进展”设计一个面向研发团队的 5 页、简洁商务风格 PPT 大纲；只输出逐页标题和要点，不创建文件。
    expected:
      route: skill_execute
      skill_id: legacy/ppt-generator
      tool_calls: []
  - case_id: ppt-generator-002
    category: business_skill_routing
    prompt: >-
      为新员工准备一份 6 页的“安全使用内部开发工具”培训演示大纲，受众是非技术岗位，风格清晰易懂。只返回文本大纲，不读取或创建文件。
    expected:
      route: skill_execute
      skill_id: legacy/ppt-generator
      tool_calls: []
